  h1 { font-size: 2rem; margin-bottom: 8px; }
  .subtitle { color: #aaa; margin-bottom: 24px; font-size: 0.95rem; }

  /* 计分板 */
  .scoreboard {
    display: flex;
    gap: 40px;
    margin-bottom: 28px;
  }
  .score-box {
    text-align: center;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 28px;
    min-width: 110px;
  }
  .score-box .label { font-size: 0.9rem; color: #ccc; margin-bottom: 4px; }
  .score-box .value { font-size: 2.2rem; font-weight: bold; }
  #playerScore { color: #4fc3f7; }
  #cpuScore    { color: #ef5350; }

  /* 对战展示区 */
  .arena {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-bottom: 18px;
    min-height: 120px;
  }
  .choice-display {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    transition: transform 0.2s;
  }
  .choice-display.pop { transform: scale(1.2); }
  .vs { font-size: 1.4rem; color: #888; font-weight: bold; }

  /* 结果文字 */
  #result {
    font-size: 1.3rem;
    min-height: 36px;
    margin-bottom: 22px;
    font-weight: bold;
  }
  .win  { color: #69f0ae; }
  .lose { color: #ff8a80; }
  .draw { color: #ffd54f; }

  /* 按钮区 */
  .buttons { display: flex; gap: 16px; margin-bottom: 24px; }
  .btn {
    width: 80px; height: 80px;
    border: none;
    border-radius: 16px;
    font-size: 2.4rem;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    transition: background 0.2s, transform 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
  .btn:active { transform: scale(0.95); }

  /* 历史记录 */
  .history {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: 360px;
    justify-content: center;
    margin-bottom: 16px;
    min-height: 28px;
  }
  .history span {
    font-size: 1.1rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
  }

  #resetBtn {
    padding: 8px 24px;
    border: 1px solid #555;
    background: transparent;
    color: #ccc;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  #resetBtn:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<h1>✊ 石头剪刀布 ✌️</h1>
<p class="subtitle">先赢 5 局者获胜！</p>

<div class="scoreboard">
  <div class="score-box">
    <div class="label">你</div>
    <div class="value" id="playerScore">0</div>
  </div>
  <div class="score-box">
    <div class="label">电脑</div>
    <div class="value" id="cpuScore">0</div>
  </div>
</div>

<div class="arena">
  <div class="choice-display" id="playerChoice">❓</div>
  <div class="vs">VS</div>
  <div class="choice-display" id="cpuChoice">❓</div>
</div>

<div id="result">请选择出拳 👇</div>

<div class="buttons">
  <button class="btn" data-choice="rock">✊</button>
  <button class="btn" data-choice="scissors">✌️</button>
  <button class="btn" data-choice="paper">✋</button>
</div>

<div class="history" id="history"></div>

<button id="resetBtn">重置比分</button>

<script>
const CHOICES = {
  rock:     { emoji: '✊', name: '石头' },
  scissors: { emoji: '✌️', name: '剪刀' },
  paper:    { emoji: '✋', name: '布' }
};

let playerScore = 0;
let cpuScore = 0;
let gameOver = false;
const WIN_TARGET = 5;

const playerEl = document.getElementById('playerChoice');
const cpuEl    = document.getElementById('cpuChoice');
const resultEl = document.getElementById('result');
const pScoreEl = document.getElementById('playerScore');
const cScoreEl = document.getElementById('cpuScore');
const historyEl = document.getElementById('history');

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => play(btn.dataset.choice));
});
document.getElementById('resetBtn').addEventListener('click', reset);

function play(playerChoice) {
  if (gameOver) return;

  const keys = Object.keys(CHOICES);
  const cpuChoice = keys[Math.floor(Math.random() * keys.length)];

  // 显示选择
  playerEl.textContent = CHOICES[playerChoice].emoji;
  cpuEl.textContent    = CHOICES[cpuChoice].emoji;
  playerEl.classList.add('pop');
  cpuEl.classList.add('pop');
  setTimeout(() => { playerEl.classList.remove('pop'); cpuEl.classList.remove('pop'); }, 200);

  // 判定
  const r = judge(playerChoice, cpuChoice);
  if (r === 'win') {
    playerScore++;
    resultEl.textContent = `你赢了！${CHOICES[playerChoice].name} 胜过 ${CHOICES[cpuChoice].name}`;
    resultEl.className = 'win';
    addHistory('✅');
  } else if (r === 'lose') {
    cpuScore++;
    resultEl.textContent = `你输了！${CHOICES[cpuChoice].name} 胜过 ${CHOICES[playerChoice].name}`;
    resultEl.className = 'lose';
    addHistory('❌');
  } else {
    resultEl.textContent = '平局！再来！';
    resultEl.className = 'draw';
    addHistory('➖');
  }

  pScoreEl.textContent = playerScore;
  cScoreEl.textContent = cpuScore;

  if (playerScore >= WIN_TARGET || cpuScore >= WIN_TARGET) {
    gameOver = true;
    const winner = playerScore >= WIN_TARGET ? '🎉 你获得了最终胜利！' : '😢 电脑获胜，再接再厉！';
    resultEl.textContent = winner;
    resultEl.className = playerScore >= WIN_TARGET ? 'win' : 'lose';
  }
}

function judge(p, c) {
  if (p === c) return 'draw';
  if ((p === 'rock' && c === 'scissors') ||
      (p === 'scissors' && c === 'paper') ||
      (p === 'paper' && c === 'rock')) return 'win';
  return 'lose';
}

function addHistory(icon) {
  const span = document.createElement('span');
  span.textContent = icon;
  historyEl.appendChild(span);
}

function reset() {
  playerScore = 0;
  cpuScore = 0;
  gameOver = false;
  pScoreEl.textContent = '0';
  cScoreEl.textContent = '0';
  playerEl.textContent = '❓';
  cpuEl.textContent = '❓';
  resultEl.textContent = '请选择出拳 👇';
  resultEl.className = '';
  historyEl.innerHTML = '';
}
</script>
</body>
</html>
